name: publish

# Trusted Publisher (Part 2 of 2).
# Part 1 is the npm-side registration: npm package -> Access ->
# Trusted Publishers -> add "AgoraIO-Community / dsh-agora / publish".
# This workflow is the GitHub-side flow that npm's OIDC check authorizes.
#
# Publish flow: push a tag `vX.Y.Z` -> sync latest skill content via the
# prepack hook -> npm publish.
#
# OIDC mode — no NPM_TOKEN secret is used. npm verifies this run's GitHub
# identity via the id-token permission and matches it against the registered
# trusted publisher on the package.
#
# Gotchas handled (see npm trusted-publishing 404 causes):
# - permissions.id-token: write is required, else no OIDC token is minted.
# - no NODE_AUTH_TOKEN env anywhere: if setup-node injects an empty one
#   (from a missing NPM_TOKEN secret), npm takes the token path and 404s
#   instead of falling through to OIDC. We pin node >= 22.14 so npm >= 11.5.1
#   ships with it (below that, trusted publishing is unsupported).

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # required: lets npm verify this run's GitHub OIDC identity

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14' # >= 22.14 bundles npm >= 11.5.1 (OIDC minimum)

      # prepack hook runs scripts/sync-deps.sh, which pulls the pinned
      # AgoraIO/skills release tag content into assets/agora before packing.
      - name: Publish to npm
        run: npm publish
        # NOTE: no env.NODE_AUTH_TOKEN here on purpose — see header comment.
